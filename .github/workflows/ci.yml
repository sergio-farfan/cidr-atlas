# CIDR Atlas
# Continuous integration: format, analyze and test every Dart package and the
# Flutter app, and syntax-check the shell scripts.
# Author: Sergio Farfan <sergio.farfan@gmail.com>
#
# Actions are pinned by full commit SHA; the trailing comment names the tag the
# SHA was resolved from. subosito/flutter-action is a composite action that
# references actions/cache@v5 by tag internally; caching is left disabled here,
# so that nested action does not run.

name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Dart (${{ matrix.package }})
    # cidr_data loads the system libsqlite3.so.0 (see the Linux override in
    # packages/cidr_data/lib/src/store.dart); the runner image provides it.
    # cidr_oci's process_runner_test spawns real Dart child processes, which
    # works on Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [cidr_core, cidr_data, cidr_oci, cidr_cli]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.5
      - name: Resolve dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze
      - name: Test
        run: dart test

  app:
    name: Flutter app (macOS)
    # The repository is private, where macOS runner minutes are billed at ten
    # times the Linux rate. The app job therefore runs on pushes to main and on
    # manual dispatch only, not on pull requests; run it for a branch with
    # workflow_dispatch when a pull request changes the app.
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/cidr_atlas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
      - name: Toolchain
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  scripts:
    name: Shell script syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh scripts/cidrctl scripts/run_macos.command; do
            bash -n "$script"
          done
