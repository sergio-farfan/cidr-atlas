# CIDR Atlas
# Shared static analysis settings for the repository.
# Author: Sergio Farfan <sergio.farfan@gmail.com>

analyzer:
  exclude:
    - '**/build/**'
    - '**/.dart_tool/**'
linter:
  rules:
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - collection_methods_unrelated_type
    - hash_and_equals
    - unrelated_type_equality_checks
