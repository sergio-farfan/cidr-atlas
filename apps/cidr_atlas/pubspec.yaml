# CIDR Atlas Flutter application dependencies and metadata.
# Author: Sergio Farfan <sergio.farfan@gmail.com>

name: cidr_atlas
description: Local-first OCI network address planning for macOS.
publish_to: none
version: 0.4.0+5
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  cidr_core:
    path: ../../packages/cidr_core
  cidr_data:
    path: ../../packages/cidr_data
  cidr_oci:
    path: ../../packages/cidr_oci
  file_selector: ^1.0.3
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
