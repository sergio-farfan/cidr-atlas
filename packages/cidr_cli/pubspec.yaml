# CIDR Atlas
# Desktop command-line package metadata and dependencies.
# Author: Sergio Farfan <sergio.farfan@gmail.com>

name: cidr_cli
description: Command line interface for CIDR Atlas inventory and planning.
version: 0.2.1
publish_to: none
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  args: ^2.7.0
  cidr_core:
    path: ../cidr_core
  cidr_data:
    path: ../cidr_data
  cidr_oci:
    path: ../cidr_oci
dev_dependencies:
  test: ^1.25.0
executables:
  cidrctl: cidrctl
